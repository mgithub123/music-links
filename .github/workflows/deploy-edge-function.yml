name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
      - 'claude/edge-function-redirects-t3KXx'
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy redirect function
        run: |
          supabase functions deploy redirect \
            --project-ref vzkfundtlfpyljfemzsn \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
