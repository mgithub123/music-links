<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Links</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080808;
      --surface:    #0e0e0e;
      --surface2:   #131313;
      --border:     #1c1c1c;
      --text:       #e0e0e0;
      --muted:      #444;
      --dim:        #1e1e1e;
      --spotify:    #1ed760;
      --apple:      #fc3c44;
      --amazon:     #00a8e1;
      --youtube:    #ff0000;
      --prerelease: #f0a500;
      --netlify:    #00c7b7;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(8,8,8,0.96);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .nav-brand { font-size: 12px; font-weight: 900; letter-spacing: 0.1em; color: #fff; text-transform: uppercase; }
    .nav-tabs  { display: flex; gap: 4px; }

    .nav-tab {
      font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 7px 14px; border-radius: 6px; border: none;
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.12s;
    }

    .nav-tab.active { background: var(--surface2); color: var(--text); }
    .nav-tab:hover  { color: #888; }

    /* ── Pages ── */
    .page { display: none; padding: 48px 20px 80px; }
    .page.active { display: flex; flex-direction: column; align-items: center; }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 520px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px; margin-bottom: 16px;
    }

    .field { margin-bottom: 22px; }

    label {
      display: block; font-size: 10px; letter-spacing: 0.3em;
      color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
    }

    .platform-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

    .pill {
      font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 20px; border: 1px solid var(--dim); color: var(--muted);
    }

    .pill.spotify { border-color: var(--spotify); color: var(--spotify); }
    .pill.apple   { border-color: var(--apple);   color: var(--apple); }
    .pill.amazon  { border-color: var(--amazon);  color: var(--amazon); }
    .pill.youtube { border-color: var(--youtube); color: var(--youtube); }

    .input-wrap { position: relative; }

    input[type="text"], input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--dim);
      border-radius: 8px; padding: 13px 40px 13px 14px; color: var(--text);
      font-family: inherit; font-size: 12px; letter-spacing: 0.02em;
      outline: none; transition: border-color 0.2s;
    }

    input:focus { border-color: #2a2a2a; }
    input.spotify { border-color: var(--spotify); }
    input.apple   { border-color: var(--apple); }
    input.amazon  { border-color: var(--amazon); }
    input.youtube { border-color: var(--youtube); }

    .clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 17px; display: none; padding: 0;
    }

    .badge-row {
      display: none; margin-top: 8px; font-size: 10px; letter-spacing: 0.08em;
      padding: 6px 10px; border-radius: 6px; border: 1px solid;
    }

    .badge-row.spotify    { color: var(--spotify); border-color: rgba(30,215,96,0.3);  background: rgba(30,215,96,0.05); }
    .badge-row.apple      { color: var(--apple);   border-color: rgba(252,60,68,0.3);   background: rgba(252,60,68,0.05); }
    .badge-row.amazon     { color: var(--amazon);  border-color: rgba(0,168,225,0.3);   background: rgba(0,168,225,0.05); }
    .badge-row.youtube    { color: var(--youtube); border-color: rgba(255,0,0,0.3);     background: rgba(255,0,0,0.05); }
    .badge-row.prerelease { color: var(--prerelease); border-color: rgba(240,165,0,0.3); background: rgba(240,165,0,0.05); }
    .badge-row.error      { color: #555; border-color: #1e1e1e; }

    .preview {
      background: var(--bg); border: 1px solid var(--dim); border-radius: 8px;
      padding: 13px 14px; font-size: 11px; color: #2a2a2a; word-break: break-all;
      line-height: 1.7; min-height: 58px; font-style: italic;
    }

    .preview.has-value { font-style: normal; color: #555; }
    .preview .app-uri  { color: #777; }
    .preview .fallback { color: #2a2a2a; font-size: 10px; }
    .preview .web-only { color: var(--prerelease); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 8px; }

    .btn {
      flex: 1; border: none; border-radius: 8px; padding: 14px;
      cursor: not-allowed; font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; transition: all 0.12s;
      background: #111; color: #252525;
    }

    .btn.active { cursor: pointer; }
    .btn.active:hover { filter: brightness(1.08); }

    #publish-btn.active  { background: var(--netlify); color: #000; }
    #publish-btn.waiting { background: #0a3d39; color: var(--netlify); cursor: wait; }

    #dl-btn {
      flex: 0 0 auto; padding: 14px 18px;
      background: transparent; border: 1px solid var(--dim);
      color: var(--muted); font-size: 10px;
    }

    #dl-btn.active { color: #000; border-color: transparent; background: var(--pc, #1ed760); }

    /* ── Result ── */
    .result {
      display: none; margin-top: 14px;
      background: rgba(0,199,183,0.05); border: 1px solid rgba(0,199,183,0.2);
      border-radius: 8px; padding: 14px 16px;
    }

    .result.show { display: block; }
    .result-label { font-size: 10px; letter-spacing: 0.2em; color: var(--netlify); text-transform: uppercase; margin-bottom: 8px; }
    .result-url   { font-size: 12px; color: #bbb; word-break: break-all; margin-bottom: 10px; }
    .result-acts  { display: flex; gap: 8px; }

    .rbtn { font-family: inherit; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .rbtn.copy { background: var(--netlify); border: none; color: #000; }
    .rbtn.open { background: transparent; border: 1px solid #2a2a2a; color: #666; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 10px; height: 10px;
      border: 2px solid rgba(0,199,183,0.3); border-top-color: var(--netlify);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }

    /* ── Links list ── */
    .links-list { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    .link-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    .link-slug  { font-size: 12px; color: #888; }
    .link-plat  { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }
    .link-plat.spotify { color: var(--spotify); }
    .link-plat.apple   { color: var(--apple); }
    .link-plat.amazon  { color: var(--amazon); }
    .link-plat.youtube { color: var(--youtube); }
    .link-copy  { font-family: inherit; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 12px; border-radius: 5px; background: transparent; border: 1px solid #1e1e1e; color: #333; cursor: pointer; }
    .link-copy:hover { border-color: #333; color: #666; }

    /* ── Dashboard ── */
    .dash-wrap { width: 100%; max-width: 960px; }

    .dash-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }

    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; }
    .stat-label { font-size: 10px; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .stat-value { font-size: 32px; font-weight: 900; letter-spacing: -0.04em; color: #fff; }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 14px; }
    .section-title { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }

    .bar-list { display: flex; flex-direction: column; gap: 10px; }
    .bar-row  { display: flex; align-items: center; gap: 12px; }
    .bar-key  { font-size: 11px; color: #555; width: 130px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #111; border-radius: 3px; height: 5px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; background: var(--netlify); transition: width 0.5s; }
    .bar-val   { font-size: 11px; color: #333; width: 32px; text-align: right; flex-shrink: 0; }

    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

    .donut-row { display: flex; flex-direction: column; gap: 8px; }
    .donut-item { display: flex; align-items: center; gap: 10px; }
    .donut-label { font-size: 11px; color: #444; width: 80px; flex-shrink: 0; }
    .donut-bar   { flex: 1; background: #111; border-radius: 3px; height: 4px; overflow: hidden; }
    .donut-fill  { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .donut-pct   { font-size: 11px; color: #333; width: 36px; text-align: right; flex-shrink: 0; }

    .clicks-table { width: 100%; border-collapse: collapse; }
    .clicks-table th { font-size: 9px; letter-spacing: 0.2em; color: #252525; text-transform: uppercase; text-align: left; padding: 0 0 12px; border-bottom: 1px solid #111; }
    .clicks-table td { font-size: 11px; color: #3a3a3a; padding: 9px 0; border-bottom: 1px solid #0e0e0e; }
    .clicks-table td:first-child { color: #555; }

    .pdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    .dash-empty { text-align: center; padding: 32px 0; font-size: 11px; color: #1e1e1e; letter-spacing: 0.1em; }

    .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .dash-heading { font-size: 10px; letter-spacing: 0.3em; color: #1e1e1e; text-transform: uppercase; }

    .refresh-btn {
      font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 7px 14px; border-radius: 6px; background: transparent;
      border: 1px solid #1a1a1a; color: #252525; cursor: pointer; transition: all 0.12s;
    }

    .refresh-btn:hover { border-color: #2a2a2a; color: #444; }

    /* ── Settings page ── */
    .settings-card {
      width: 100%; max-width: 520px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px;
    }

    .settings-title { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; margin-bottom: 24px; }

    .settings-field { margin-bottom: 20px; }

    .settings-row { display: flex; gap: 8px; }

    .save-btn {
      font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 13px 18px; border-radius: 8px; background: var(--netlify);
      border: none; color: #000; cursor: pointer; font-weight: 700; flex-shrink: 0;
    }

    .status-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #222; margin-right: 8px; vertical-align: middle; transition: all 0.2s;
    }

    .status-dot.on { background: var(--netlify); box-shadow: 0 0 5px rgba(0,199,183,0.5); }

    .settings-note { font-size: 10px; color: #252525; margin-top: 8px; line-height: 1.6; }
    .settings-note a { color: var(--netlify); text-decoration: none; }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Music Links</span>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-generator" onclick="showPage('generator', this)">Generator</button>
    <button class="nav-tab" id="tab-dashboard" onclick="showPage('dashboard', this)">Dashboard</button>
  </div>
</nav>

<!-- ══ Generator ══════════════════════════════════════════════════════════════ -->
<div class="page active" id="page-generator">

  <div class="card">
    <div class="field">
      <label>Paste any music link</label>
      <div class="platform-pills">
        <span class="pill spotify">Spotify</span>
        <span class="pill apple">Apple Music</span>
        <span class="pill amazon">Amazon Music</span>
        <span class="pill youtube">YouTube</span>
      </div>
      <div class="input-wrap">
        <input type="text" id="url-input" placeholder="Paste a link from any platform…" autocomplete="off" spellcheck="false" />
        <button class="clear" id="clear-btn" onclick="clearInput()">×</button>
      </div>
      <div class="badge-row" id="badge"></div>
    </div>

    <div class="field">
      <label>Slug <span style="color:#1a1a1a;letter-spacing:0">(your shareable URL path)</span></label>
      <input type="text" id="slug-input" placeholder="e.g. work-work-work" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field" style="margin-bottom:20px;">
      <label>Preview</label>
      <div class="preview" id="preview">Paste a link above…</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="publish-btn" onclick="publishLink()">Publish Link</button>
      <button class="btn" id="dl-btn" onclick="downloadFile()">↓ Save</button>
    </div>

    <div class="result" id="result">
      <div class="result-label">✓ Live</div>
      <div class="result-url" id="result-url"></div>
      <div class="result-acts">
        <button class="rbtn copy" onclick="copyResult()">Copy URL</button>
        <button class="rbtn open" onclick="openResult()">Open ↗</button>
      </div>
    </div>
  </div>

  <!-- Published links list -->
  <div class="links-list" id="links-list"></div>

</div>

<!-- ══ Dashboard ══════════════════════════════════════════════════════════════ -->
<div class="page" id="page-dashboard">
  <div class="dash-wrap">

    <div class="dash-top">
      <span class="dash-heading">Analytics</span>
      <button class="refresh-btn" id="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
    </div>

    <div class="dash-grid">
      <div class="stat-card"><div class="stat-label">Total Clicks</div><div class="stat-value" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Links</div><div class="stat-value" id="s-links">—</div></div>
      <div class="stat-card"><div class="stat-label">Mobile</div><div class="stat-value" id="s-mobile">—</div></div>
      <div class="stat-card"><div class="stat-label">App Opens</div><div class="stat-value" id="s-app">—</div></div>
    </div>

    <div class="section">
      <div class="section-title">Clicks per link</div>
      <div class="bar-list" id="bar-links"><div class="dash-empty">No data yet</div></div>
    </div>

    <div class="split-grid">
      <div class="section" style="margin-bottom:0;">
        <div class="section-title">Platform</div>
        <div class="donut-row" id="d-platform"><div class="dash-empty" style="padding:16px 0">—</div></div>
      </div>
      <div class="section" style="margin-bottom:0;">
        <div class="section-title">Device</div>
        <div class="donut-row" id="d-device"><div class="dash-empty" style="padding:16px 0">—</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Top countries</div>
      <div class="bar-list" id="bar-countries"><div class="dash-empty">No data yet</div></div>
    </div>

    <div class="section">
      <div class="section-title">Top referrers</div>
      <div class="bar-list" id="bar-referrers"><div class="dash-empty">No data yet</div></div>
    </div>

    <div class="section">
      <div class="section-title">Recent clicks</div>
      <div id="recent-clicks"><div class="dash-empty">No data yet</div></div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════════════════════════
function showPage(id, tab) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".nav-tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-" + id).classList.add("active");
  tab.classList.add("active");
  if (id === "dashboard") loadDashboard();
  if (id === "generator") loadLinksList();
}

// ═══════════════════════════════════════════════════════════════════════════════
// PLATFORM DETECTION
// ═══════════════════════════════════════════════════════════════════════════════
function detectPlatform(url) {
  url = url.trim();
  var spre = url.match(/spotify\.com\/(prerelease)\/([A-Za-z0-9]+)/);
  if (spre) return { platform:"spotify", type:"prerelease", id:spre[2], webOnly:true, raw:url };

  var sp = url.match(/spotify\.com\/(track|album|artist|playlist|show|episode|user)\/([A-Za-z0-9]+)/);
  if (sp) return { platform:"spotify", type:sp[1], id:sp[2], webOnly:false, raw:url };
  var sp2 = url.match(/spotify:(track|album|artist|playlist|show|episode|user):([A-Za-z0-9]+)/);
  if (sp2) return { platform:"spotify", type:sp2[1], id:sp2[2], webOnly:false, raw:url };

  if (/music\.apple\.com/.test(url)) return { platform:"apple", type:"universal", id:"", webOnly:false, raw:url };
  if (/music\.amazon\.[a-z.]+/.test(url)) return { platform:"amazon", type:"universal", id:"", webOnly:false, raw:url };

  var ytv = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]+)/);
  if (ytv) return { platform:"youtube", type:"video", id:ytv[1], webOnly:false, raw:url };
  if (/(?:music\.)?youtube\.com/.test(url)) return { platform:"youtube", type:"universal", id:"", webOnly:false, raw:url };

  return null;
}

var COLORS = { spotify:"#1ed760", apple:"#fc3c44", amazon:"#00a8e1", youtube:"#ff0000" };
var LABELS = { spotify:"Spotify", apple:"Apple Music", amazon:"Amazon Music", youtube:"YouTube" };

function buildWebUrl(p) {
  if (p.platform === "spotify") return "https://open.spotify.com/" + p.type + "/" + p.id;
  return p.raw.split(/[?&]/)[0];
}

function buildAppUri(p) {
  if (p.platform === "spotify" && !p.webOnly) return "spotify:" + p.type + ":" + p.id;
  if (p.platform === "youtube" && p.type === "video") return "vnd.youtube:" + p.id;
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// GENERATOR UI
// ═══════════════════════════════════════════════════════════════════════════════
var currentParsed = null;
var lastResultUrl = "";

function update() {
  var raw     = document.getElementById("url-input").value.trim();
  var inputEl = document.getElementById("url-input");
  var clearEl = document.getElementById("clear-btn");
  var badge   = document.getElementById("badge");
  var preview = document.getElementById("preview");

  clearEl.style.display = raw ? "block" : "none";
  inputEl.className = "";

  if (!raw) {
    badge.style.display = "none";
    preview.className = "preview";
    preview.innerHTML = "Paste a link above…";
    currentParsed = null; updateBtns(); return;
  }

  var p = detectPlatform(raw);
  if (!p) {
    badge.style.display = "block"; badge.className = "badge-row error";
    badge.textContent = "⚠ Not recognized — paste a Spotify, Apple Music, Amazon Music, or YouTube link";
    preview.className = "preview"; preview.innerHTML = "Unrecognized link.";
    currentParsed = null; updateBtns(); return;
  }

  currentParsed = p;
  inputEl.classList.add(p.platform);
  badge.style.display = "block";
  badge.className = "badge-row " + (p.webOnly ? "prerelease" : p.platform);
  badge.textContent = p.webOnly
    ? "⚡ Prerelease — redirects to web player"
    : "✓ " + LABELS[p.platform] + " detected" + (p.type && p.type !== "universal" ? " · " + p.type.toUpperCase() : "");

  var webUrl = buildWebUrl(p);
  var appUri = buildAppUri(p);
  preview.className = "preview has-value";

  if (p.webOnly) {
    preview.innerHTML = '<span class="web-only">⚡ Web redirect only</span><br><span class="fallback">↳ ' + webUrl + '</span>';
  } else if (appUri) {
    preview.innerHTML = '<span class="app-uri">' + appUri + '</span><br><span class="fallback">↳ fallback: ' + webUrl + '</span>';
  } else {
    preview.innerHTML = '<span class="fallback">Universal link → ' + webUrl + '</span>';
  }

  document.getElementById("dl-btn").style.setProperty("--pc", COLORS[p.platform] || "#1ed760");
  updateBtns();
}

function updateBtns() {
  var hasLink = !!currentParsed;
  document.getElementById("publish-btn").classList.toggle("active", hasLink);
  document.getElementById("dl-btn").classList.toggle("active", hasLink);
}

function clearInput() {
  document.getElementById("url-input").value = "";
  document.getElementById("result").classList.remove("show");
  update();
}

document.getElementById("url-input").addEventListener("input", update);

// ═══════════════════════════════════════════════════════════════════════════════
// PUBLISH — calls /links function, no deploy needed
// ═══════════════════════════════════════════════════════════════════════════════
async function publishLink() {
  if (!currentParsed) return;

  var slug    = getSlug();
  var pub     = document.getElementById("publish-btn");
  var resultEl = document.getElementById("result");

  pub.classList.remove("active"); pub.classList.add("waiting");
  pub.innerHTML = '<span class="spinner"></span>Publishing…';
  resultEl.classList.remove("show");

  try {
    var p      = currentParsed;
    var webUrl = buildWebUrl(p);
    var appUri = buildAppUri(p);

    var res = await fetch("/.netlify/functions/links", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        slug:         slug,
        platform:     p.platform,
        app_uri:      appUri,
        web_url:      webUrl,
        web_only:     p.webOnly || false,
        original_url: p.raw,
      }),
    });

    if (res.status === 409) {
      // Slug already exists — just use it
    } else if (!res.ok) {
      var err = await res.json().catch(function(){ return {}; });
      throw new Error(err.error || res.status);
    }

    lastResultUrl = window.location.origin + "/go?slug=" + encodeURIComponent(slug);
    document.getElementById("result-url").textContent = lastResultUrl;
    resultEl.classList.add("show");
    loadLinksList();

  } catch(e) {
    alert("Publish failed: " + e.message);
  } finally {
    pub.classList.remove("waiting"); pub.classList.add("active");
    pub.textContent = "Publish Link";
  }
}

function copyResult() {
  navigator.clipboard.writeText(lastResultUrl).catch(function() {
    var ta = document.createElement("textarea");
    ta.value = lastResultUrl; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  });
  var btn = document.querySelector(".rbtn.copy");
  btn.textContent = "✓ Copied";
  setTimeout(function(){ btn.textContent = "Copy URL"; }, 2000);
}

function openResult() { if (lastResultUrl) window.open(lastResultUrl, "_blank"); }

function getSlug() {
  var raw = document.getElementById("slug-input").value.trim();
  if (raw) return raw.replace(/[^a-zA-Z0-9._-]/g, "-");
  if (!currentParsed) return "music-link";
  return currentParsed.platform + (currentParsed.id ? "-" + currentParsed.id.slice(0,8) : "-link");
}

// ═══════════════════════════════════════════════════════════════════════════════
// DOWNLOAD (offline fallback)
// ═══════════════════════════════════════════════════════════════════════════════
function buildRedirectHtml(p) {
  var web   = buildWebUrl(p);
  var app   = buildAppUri(p);
  var color = COLORS[p.platform] || "#fff";
  var label = LABELS[p.platform] || "Music";
  var css   = "html,body{margin:0;padding:0;background:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}.dots{display:flex;gap:6px;}.dot{width:6px;height:6px;background:"+color+";border-radius:50%;animation:p 1.2s ease-in-out infinite;}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes p{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}";
  var dots  = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  if (p.webOnly || !app) {
    return "<!DOCTYPE html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Opening "+label+"\u2026</title><style>"+css+"</style></head><body>"+dots+"<script>window.location.href='"+web+"';<\/script></body></html>";
  }
  return "<!DOCTYPE html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Opening "+label+"\u2026</title><style>"+css+"</style></head><body>"+dots+"<script>var app='"+app+"',web='"+web+"',mob=/iphone|ipad|ipod|android/i.test(navigator.userAgent);function go(){if(!mob){window.location.href=web;return;}var t=setTimeout(function(){window.location.href=web;},1800);document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(t);});window.addEventListener('pagehide',function(){clearTimeout(t);});window.location.href=app;}setTimeout(go,100);<\/script></body></html>";
}

function downloadFile() {
  if (!currentParsed) return;
  var html = buildRedirectHtml(currentParsed);
  var slug = getSlug();
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = slug + ".html"; a.click(); URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════════════════════
// LINKS LIST
// ═══════════════════════════════════════════════════════════════════════════════
async function loadLinksList() {
  try {
    var res  = await fetch("/.netlify/functions/links");
    var rows = await res.json();
    var el   = document.getElementById("links-list");

    if (!rows.length) { el.innerHTML = ""; return; }

    el.innerHTML = rows.map(function(r) {
      var url = window.location.origin + "/go?slug=" + encodeURIComponent(r.slug);
      return '<div class="link-item">'
        + '<div><div class="link-slug">/' + r.slug + '</div><div class="link-plat ' + r.platform + '">' + (LABELS[r.platform]||r.platform) + '</div></div>'
        + '<button class="link-copy" onclick="copyText(\'' + url + '\', this)">Copy</button>'
        + '</div>';
    }).join("");
  } catch(e) {}
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).catch(function() {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  });
  btn.textContent = "✓";
  setTimeout(function(){ btn.textContent = "Copy"; }, 1500);
}

// ═══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════════
function pct(n, t) { return t ? Math.round(n / t * 100) : 0; }

function groupBy(rows, key) {
  var c = {};
  rows.forEach(function(r){ var k = r[key]||"unknown"; c[k]=(c[k]||0)+1; });
  return Object.entries(c).sort(function(a,b){ return b[1]-a[1]; }).map(function(e){ return {key:e[0],count:e[1]}; });
}

function renderBars(id, rows, total, colorFn) {
  var el = document.getElementById(id);
  if (!rows.length) { el.innerHTML = '<div class="dash-empty">No data yet</div>'; return; }
  el.innerHTML = rows.slice(0,8).map(function(r) {
    var p = pct(r.count, total);
    var color = colorFn ? colorFn(r.key) : "var(--netlify)";
    return '<div class="bar-row"><span class="bar-key" title="'+(r.key||"—")+'">'+(r.key||"—")+'</span><div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+color+';"></div></div><span class="bar-val">'+r.count+'</span></div>';
  }).join("");
}

function renderDonut(id, rows, total, colorFn) {
  var el = document.getElementById(id);
  if (!rows.length) { el.innerHTML = '<div class="dash-empty" style="padding:12px 0">—</div>'; return; }
  el.innerHTML = rows.slice(0,5).map(function(r) {
    var p = pct(r.count, total);
    var color = colorFn ? colorFn(r.key) : "var(--netlify)";
    return '<div class="donut-item"><span class="donut-label">'+(r.key||"unknown")+'</span><div class="donut-bar"><div class="donut-fill" style="width:'+p+'%;background:'+color+';"></div></div><span class="donut-pct">'+p+'%</span></div>';
  }).join("");
}

async function loadDashboard() {
  var btn = document.getElementById("refresh-btn");
  btn.textContent = "↻ Loading…";

  try {
    // Fetch clicks from Supabase directly (read-only, anon key is safe)
    var sbUrl = localStorage.getItem("sburl");
    var sbKey = localStorage.getItem("sbkey");

    if (!sbUrl || !sbKey) {
      document.getElementById("bar-links").innerHTML = '<div class="dash-empty">Connect Supabase in Settings to see analytics</div>';
      return;
    }

    var res  = await fetch(sbUrl + "/rest/v1/clicks?select=*&order=clicked_at.desc&limit=2000", {
      headers: { apikey: sbKey, Authorization: "Bearer " + sbKey }
    });
    var rows = await res.json();

    var total  = rows.length;
    var mobile = rows.filter(function(r){ return r.device==="mobile"||r.device==="tablet"; }).length;
    var appOp  = rows.filter(function(r){ return r.link_type==="app"; }).length;
    var slugs  = new Set(rows.map(function(r){ return r.slug; })).size;

    document.getElementById("s-total").textContent  = total;
    document.getElementById("s-links").textContent  = slugs;
    document.getElementById("s-mobile").textContent = total ? pct(mobile,total)+"%" : "—";
    document.getElementById("s-app").textContent    = total ? pct(appOp,total)+"%" : "—";

    renderBars("bar-links", groupBy(rows,"slug"), total, null);
    renderDonut("d-platform", groupBy(rows,"platform"), total, function(k){ return COLORS[k]||"#555"; });
    renderDonut("d-device", groupBy(rows,"device"), total, function(k){
      return k==="mobile"?"#1ed760":k==="tablet"?"#00a8e1":"#666";
    });
    renderBars("bar-countries", groupBy(rows,"country"), total, null);

    var refRows = rows.filter(function(r){ return r.referrer; });
    var refG = groupBy(refRows,"referrer").map(function(r){
      try { r.key = new URL(r.key).hostname; } catch(e){}
      return r;
    });
    renderBars("bar-referrers", refG, refRows.length, null);

    var recent = rows.slice(0,20);
    if (!recent.length) {
      document.getElementById("recent-clicks").innerHTML = '<div class="dash-empty">No clicks yet</div>';
    } else {
      var html = '<table class="clicks-table"><thead><tr><th>Time</th><th>Link</th><th>Platform</th><th>Type</th><th>Device</th><th>Country</th></tr></thead><tbody>';
      recent.forEach(function(r){
        var d = new Date(r.clicked_at);
        var t = d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
        var c = COLORS[r.platform]||"#555";
        html += '<tr><td>'+t+'</td><td>'+r.slug+'</td><td><span class="pdot" style="background:'+c+'"></span>'+r.platform+'</td><td>'+(r.link_type||"—")+'</td><td>'+(r.device||"—")+'</td><td>'+(r.country||"—")+'</td></tr>';
      });
      html += "</tbody></table>";
      document.getElementById("recent-clicks").innerHTML = html;
    }

  } catch(e) {
    console.error(e);
  } finally {
    btn.textContent = "↻ Refresh";
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════

// Check if ?settings in URL — show settings prompt
if (window.location.search.includes("settings")) {
  var sbUrl = prompt("Supabase URL:");
  var sbKey = prompt("Supabase anon key:");
  if (sbUrl && sbKey) {
    localStorage.setItem("sburl", sbUrl.trim());
    localStorage.setItem("sbkey", sbKey.trim());
    alert("Saved! Reload the page.");
  }
}

update();
loadLinksList();
</script>
